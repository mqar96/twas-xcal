[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "twas-xcal"
version = "0.2.0"
description = "Ancestry-aware null calibration for transcriptome-wide association studies (XCAL / XCAL-t) and a multi-ancestry TWAS null benchmark"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Muhammad Qudduse Ahmad Rao", email = "qudduse1234@gmail.com"}]
requires-python = ">=3.10"
keywords = ["TWAS", "GWAS", "statistical genetics", "polygenicity", "multi-ancestry", "linkage disequilibrium", "type I error", "bioinformatics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
sim = ["msprime>=1.3", "stdpopsim>=0.2", "scikit-learn>=1.7", "joblib>=1.3", "matplotlib>=3.8", "pandas>=2.2"]
real = ["bed-reader>=1.0", "matplotlib>=3.8", "pandas>=2.2"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/mqar96/twas-xcal"
Issues = "https://github.com/mqar96/twas-xcal/issues"
Changelog = "https://github.com/mqar96/twas-xcal/blob/main/CHANGELOG.md"
Archive = "https://doi.org/10.5281/zenodo.24028643"

[tool.setuptools]
packages = ["xcal"]
