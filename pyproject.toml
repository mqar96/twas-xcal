[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twas-xcal"
version = "0.1.0"
description = "Ancestry-aware null calibration for transcriptome-wide association studies (TWAS) plus a multi-ancestry TWAS null simulator"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Muhammad Qudduse Ahmad Rao"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
sim = ["msprime>=1.3", "stdpopsim>=0.2", "scikit-learn>=1.4", "joblib", "matplotlib", "pyarrow"]
test = ["pytest"]

[tool.setuptools]
packages = ["xcal"]
