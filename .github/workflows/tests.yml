name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wheel:
    name: wheel install + tests (py${{ matrix.python-version }}${{ matrix.min && ', minimum deps' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            min: true
          - python-version: "3.11"
          - python-version: "3.12"
          - python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install minimum dependency versions
        if: matrix.min
        run: pip install "numpy==1.24.4" "scipy==1.10.1" "pandas==2.0.3"
      - name: Install wheel outside the checkout
        run: pip install dist/*.whl pytest
      - name: Run tests against the installed wheel
        run: |
          mkdir -p /tmp/t && cp tests/*.py /tmp/t/ && cd /tmp/t
          python -c "import xcal, sys; print(xcal.__version__, xcal.__file__); assert 'site-packages' in xcal.__file__"
          python -m pytest -q /tmp/t

  smoke:
    name: end-to-end smoke reproduction (sim + analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with simulation extras
        run: pip install ".[sim,real,test]"
      - name: Tiny pipeline
        run: |
          W=$(mktemp -d)
          python scripts/01_simulate_genotypes.py $W/geno --n-regions 3 --jobs 2
          python scripts/02_train_weights.py $W/geno $W/weights --genes-per-region 4 --jobs 2
          python scripts/03_null_benchmark.py $W/geno $W/weights $W/bench --reps 2000 --jobs 2
          python scripts/05_analyze_null.py $W/bench $W/res --boot 50
          python scripts/08_estimated_c_benchmark.py $W/geno $W/weights $W/estc.csv --genomes 5
          test -s $W/res/table_null_counts.csv
