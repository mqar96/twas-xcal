[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twas-xcal"
version = "0.1.0"
description = "Ancestry-aware null calibration for transcriptome-wide association studies (TWAS) plus a multi-ancestry TWAS null simulator"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Muhammad Qudduse Ahmad Rao", email = "qudduse1234@gmail.com"}]
requires-python = ">=3.10"
keywords = ["TWAS", "GWAS", "statistical genetics", "polygenicity", "multi-ancestry", "linkage disequilibrium", "type I error", "bioinformatics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
sim = ["msprime>=1.3", "stdpopsim>=0.2", "scikit-learn>=1.4", "joblib", "matplotlib", "pyarrow"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/mqar96/twas-xcal"
Issues = "https://github.com/mqar96/twas-xcal/issues"
Changelog = "https://github.com/mqar96/twas-xcal/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["xcal"]
